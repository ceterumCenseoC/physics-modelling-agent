[project]
name = "physicsmodellinghelper"
version = "0.1.0"
description = "physicsModellingHelper using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.2"
]

[project.scripts]
physicsmodellinghelper = "physicsmodellinghelper.main:run"
run_crew = "physicsmodellinghelper.main:run"
train = "physicsmodellinghelper.main:train"
replay = "physicsmodellinghelper.main:replay"
test = "physicsmodellinghelper.main:test"
run_with_trigger = "physicsmodellinghelper.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
