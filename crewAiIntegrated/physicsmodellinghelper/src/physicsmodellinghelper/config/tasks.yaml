gathering_task:
  description: >
    find 3 relevant papers for {topic}. Include papers that explore ideas for {aim}.
  expected_output: >
    a list with the important sources: arxivID, Author, date, url, short summary.
    Sort the sources by relevance. MARKDOWN format with $...$ and $$...$$.
  agent: source_gatherer

downloading_task:
  description: >
    download the papers found by the previous task. Make sure you download the correct papers and nothing more or less.
  expected_output: >
    the according papers should be downloaded. Provide a very short report about issues or problem encountered.
    The path where the downloaded papers are stored (the absolute path should be: C:\Users\Janis\work\university\bachelorThesis\physics-modelling-agent\crewAiIntegrated\physicsmodellinghelper\src\physicsmodellinghelper\arxiv_papers7)
  agent: paper_downloader

extraction_task:
  description: >
    List 3 formulas from every paper you find inside the given directory: C:\Users\Janis\work\university\bachelorThesis\physics-modelling-agent\crewAiIntegrated\physicsmodellinghelper\src\physicsmodellinghelper\arxiv_papers7
  expected_output: >
    3 exact formulas with the paper they are derived from. MARKDOWN format with $...$ and $$...$$.
  agent: information_extractor

simple_modelling_task:
  description: >
    use the information provided by the extraction_task to create a model that accomplishes {aim}.
  expected_output: >
    a matematical description of the modell with textual explaination that describes the model and allows for a numerical implementations. MARKDOWN format with $...$ and $$...$$.
  agent: simple_modeller

simulation_task:
  description: >
    use the simple_modelling_task's result to code a numerical implementation of the same model for {aim}.
  expected_output: >
    continious python code that only needs to be copy pasted into a pyhton file and can be executed. The code should be well documented.
  agent: model_simulator

checking_task:
  description: >
    compare the current model to existing results for {aim}. Determine how good the simulation currently is.
  expected_output: >
    a table comparing the most important aspects and a short text summarizing the most important results. MARKDOWN format with $...$ and $$...$$.
  agent: checker